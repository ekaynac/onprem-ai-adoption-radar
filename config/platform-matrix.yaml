    verified: "2026-07-29"
    notes: >-
      Backend table has no Gaudi/Habana entry. Tensor-parallel split mode is
      explicitly EXPERIMENTAL and unimplemented for most MoE/hybrid
      architectures (expert placement instead relies on manual
      --n-cpu-moe/--override-tensor flags). FP8 is not a first-class ggml
      dtype — it exists only as the internal scale format inside
      MXFP4/NVFP4 blocks. AWQ/GPTQ GGUF-conversion tooling was
      removed/never supported.

