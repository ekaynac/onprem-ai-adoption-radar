      - https://raw.githubusercontent.com/ml-explore/mlx/main/python/src/ops.cpp
    verified: "2026-07-29"
    notes: >-
      MLX is no longer Apple-only: mlx core now ships an official CUDA
      backend for Linux/NVIDIA (pip install mlx[cuda12]) and a separate
      CPU-only Linux backend, alongside its original Metal/Apple-Silicon
      path — mlx-lm's own setup.py confirms this at the package level
      (extras_require cuda12/cuda13/cpu each pull in the matching mlx[...]
      backend, overriding the base install_requires' Darwin-only mlx
      dependency) — no AMD/Gaudi/Ascend backend exists in either repo. GGUF
      is export-only and limited to Mistral/Mixtral/Llama-style models
      (mlx-lm cannot load a .gguf file for inference). KV-cache
      quantization is integer/affine, not FP8-format.

