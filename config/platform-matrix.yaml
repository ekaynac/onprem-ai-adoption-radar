      gguf: "yes"
      kv_cache_fp8: "no"
      speculative_decoding: "partial"
      prefix_caching: "yes"
      disaggregated_prefill: "no"
    sources:
      - https://github.com/ollama/ollama/blob/main/README.md
      - https://github.com/ollama/ollama/blob/main/docs/gpu.mdx
      - https://github.com/ollama/ollama/blob/main/docs/faq.mdx
      - https://github.com/ollama/ollama/blob/main/docs/import.mdx
      - https://github.com/ollama/ollama/pull/13151
      - https://ollama.com/library/qwen3.6/tags
      - https://github.com/ollama/ollama/issues/16056
    verified: "2026-07-29"
    notes: >-
      Judged on Ollama's own documented behavior, not inherited llama.cpp
      capability. gpu.mdx (the dedicated hardware doc) covers only
      Nvidia/AMD-ROCm/Metal/Vulkan — no Ascend or Gaudi section. No
      tensor-parallel/split-mode flag is exposed; MoE expert-offload PRs are
      unmerged. Speculative decoding merged only on the Apple-Silicon MLX
      runner for specific models — the general feature request is still
      open. No hybrid state-space models in Ollama's library
      (Jamba/Mamba/Falcon-Mamba all 404 on ollama.com). nvfp4 downgraded to
      partial: import.mdx's own quantize docs list only q8_0/q4_K_S/q4_K_M,
      and NVFP4-tagged models exist on ollama.com/library (e.g.
      qwen3.6:27b-coding-nvfp4) but loading one hits an open,
      unresolved crash — issue #16056 reports
      `ggml.c:1676: GGML_ASSERT(type >= 0 && type < GGML_TYPE_COUNT) failed`
      loading an NVFP4 GGUF; the corresponding llama.cpp PR is linked but not
      yet ported to Ollama's fork.

