      (overview.mdx lists only nvidia/amd/ascend/cpu/jetson/tpu/xpu), but
      --device accepts "hpu" and a legacy HpuCommunicator class exists
      (inherited from the vLLM lineage). gguf is NVIDIA+Ascend only — no
      AMD/ROCm (Marlin-kernel dependent).

