# Platform capability matrix — schema v1 (capacity radar sub-project C, Task 7).
#
# Every hardware/feature cell is a cited claim: does this serving engine
# support this GPU/NPU family, or this serving feature (MLA, FP8 KV cache,
# disaggregated prefill, ...)? Cells were live-verified against each engine's
# own docs/README/release notes on the `verified` date below — `unknown` is
# the honest default when a claim could not be confirmed; this seed never
# guesses "yes". All values are quoted (YAML-1.1 boolean trap: unquoted
# yes/no parse as bool, not string — see platform_matrix.py's before-
# validator for the hand-edit fallback).
#
# NOTE (documented scope deferral, spec §5.4): keeping this matrix current by
# cross-linking the release notes the radar already collects is NOT built
# here — citations + verified dates ship now; the release-note cross-linker
# is a follow-up (see CHANGELOG).
version: "1.0"
platforms:
  - id: vllm
    name: vLLM
    repo_url: https://github.com/vllm-project/vllm
    hardware:
      nvidia: "yes"
      amd: "yes"
      intel_gaudi: "yes"
      apple: "yes"
      ascend: "yes"
      cpu: "yes"
    features:
      tensor_parallel: "yes"
      pipeline_parallel: "yes"
      expert_parallel: "yes"
      mla: "yes"
      hybrid_attention: "yes"
      fp8: "yes"
      nvfp4: "yes"
      awq: "yes"
      gptq: "yes"
      gguf: "yes"
      kv_cache_fp8: "yes"
      speculative_decoding: "yes"
      prefix_caching: "yes"
      disaggregated_prefill: "partial"
    sources:
      - https://docs.vllm.ai/en/latest/getting_started/installation/gpu/index.html
      - https://docs.vllm.ai/en/latest/getting_started/installation/cpu/index.html
      - https://docs.vllm.ai/en/latest/features/quantization/index.html
      - https://docs.vllm.ai/en/latest/features/quantization/gguf.html
      - https://docs.vllm.ai/en/latest/features/quantization/modelopt/
      - https://docs.vllm.ai/en/latest/features/quantization/quantized_kvcache/
      - https://docs.vllm.ai/en/latest/features/speculative_decoding.html
      - https://docs.vllm.ai/en/latest/features/automatic_prefix_caching.html
      - https://docs.vllm.ai/en/latest/features/disagg_prefill.html
      - https://docs.vllm.ai/en/latest/serving/parallelism_scaling.html
      - https://docs.vllm.ai/en/latest/serving/expert_parallel_deployment.html
      - https://docs.vllm.ai/en/latest/models/supported_models.html
      - https://github.com/vllm-project/vllm-metal
      - https://github.com/vllm-project/vllm-gaudi
      - https://github.com/vllm-project/vllm-ascend
    verified: "2026-07-29"
    notes: >-
      Apple GPU support ships via the vllm-project-org vllm-metal plugin
      (MLX backend); Gaudi/Ascend likewise via official out-of-tree
      vllm-project plugins, not the in-tree core. GGUF requires the separate
      vllm-gguf-plugin. Disaggregated prefill is documented but the page
      itself is titled "experimental".

