  # --- Huawei Ascend ---
  # Huawei publishes sparsely for Ascend chips; figures below are corroborated via
  # CSET (Georgetown Center for Security and Emerging Technology), a reputable
  # secondary source specializing in Chinese semiconductor export-control analysis,
  # since Huawei has no public datasheet. The Ascend 910B ships in several
  # sub-variants (910B1/B2/B3/B4) with FP16 TFLOPS ranging ~280-400 across them;
  # 313 TFLOPS (910B2/910B3, the commonly cited mainstream SKU) is used below.
  - id: ascend-910b-64gb
    name: "Ascend 910B (64GB)"
    kind: gpu
    total_memory_gb: 64
    memory_bandwidth_gbs: 1600          # CSET: "910B1...reach this 1600 GB/s maximum with four stacks of 16 GB HBM (64 GB in total per chip)" (verified 2026-07-29)
    tflops_fp16: 313                    # CSET: "910B3...313 TFLOPS" (25 cores x 1.8GHz); 910B1 variant reaches 400 TFLOPS
    spec_url: https://cset.georgetown.edu/publication/pushing-the-limits-huaweis-ai-chip-tests-u-s-export-controls/
    verified: "2026-07-29"
    datacenter: true
    # tdp_watts omitted: Huawei does not publish TDP for Ascend 910B; not found via CSET or other public reporting as of 2026-07-29
    # tflops_fp8 omitted: no public source confirms FP8 Tensor support/throughput for Ascend 910B as of 2026-07-29
    # indicative_price_usd omitted: Huawei publishes no list price as of 2026-07-29
  # ascend-910c dropped as of 2026-07-29: Wikipedia (HiSilicon) confirms it combines
  # two Ascend 910B dies and claims "~60% of H100 inference performance" (DeepSeek
  # researchers), but neither that page, CSET, nor SemiAnalysis's Huawei CloudMatrix
  # 910C teardown (via fibermall.com) publish a per-chip memory/bandwidth/TFLOPS/TDP
  # figure — only cluster-level (CloudMatrix 384) aggregates. Per the cardinal rule,
  # dropped rather than sourced from lower-tier aggregator blogs with no clear primary
  # citation.

