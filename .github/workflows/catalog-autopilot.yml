name: Catalog autopilot

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write # commit updated model-seed.yaml
  actions: write  # dispatch publish.yml after commit

# Prevent two autopilot runs racing to modify model-seed.yaml.
concurrency:
  group: catalog-autopilot
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package (locked)
        run: uv sync --locked --no-dev

      - name: Discover model candidates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run radar models discover --root .

      # Evidence hygiene: ingest self-reported benchmark scores from model
      # cards, then surface remaining gaps in the step summary. The HF token
      # (when configured as a repo secret) lets gated cards (gemma, command-r,
      # …) be fetched instead of 401-ing — otherwise only public cards fill.
      - name: Ingest model-card benchmarks
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run radar models benchcards --root .

      - name: Benchmark debt report
        if: always()
        run: |
          echo "## Benchmark debt (evidence gaps)" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          uv run radar models benchdebt --root . >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Promote top candidates into catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: uv run radar models promote --root . --limit 5

      # Belt-and-suspenders gate: verify the catalog still loads and IDs are unique.
      # If promote already aborted (non-zero exit) this step is never reached.
      # If something slipped through, this catches it before any commit happens.
      - name: Catalog integrity gate
        run: |
          uv run python -c "
          from pathlib import Path
          from radar.models_radar.seed import load_model_seed
          seeds = load_model_seed(Path('config/model-seed.yaml'))
          ids = [s.id for s in seeds]
          assert len(ids) == len(set(ids)), 'duplicate seed ids'
          print(f'catalog OK: {len(seeds)} models, ids unique')
          "

      # Commit when the catalog OR the ingested benchmark evidence changed.
      # benchcards writes data/benchmark-observations.jsonl — that evidence must
      # be committed too, or the self-evolving loop silently loses it. promote
      # validates-or-aborts before writing, so if we reach here the catalog is
      # known good. We use a $GITHUB_OUTPUT flag so the dispatch step can reuse
      # the same condition cleanly.
      - name: Commit catalog + evidence changes (if any)
        id: commit
        run: |
          if git diff --quiet -- config/model-seed.yaml data/benchmark-observations.jsonl; then
            echo "No new models or benchmark evidence this week — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "radar-bot"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add config/model-seed.yaml data/benchmark-observations.jsonl
            git commit -m "chore(catalog): autopilot model + evidence refresh $(date -u +%F)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Pushes made by GITHUB_TOKEN do NOT auto-trigger other workflows (GitHub
      # security restriction).  So the daily publish.yml would not pick up this
      # commit until its next scheduled run.  The explicit dispatch below ensures
      # the live site refreshes immediately after new models land in the catalog.
      - name: Dispatch publish to refresh live site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run publish.yml --ref main
