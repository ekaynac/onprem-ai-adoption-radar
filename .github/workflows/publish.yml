name: Publish radar to Pages

on:
  schedule:
    - cron: "17 */2 * * *" # platform-wide freshness: discovery + publish every two hours
    - cron: "43 5 * * 0" # weekly trusted-claim reverification
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: write # update the state release asset and small publication logs
  pages: write
  id-token: write

# Allow only one concurrent deployment, don't cancel an in-progress run.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Full history is needed so the committed history log carries forward.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync --all-extras

      - uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend
        run: npm ci --prefix frontend

      - name: Restore canonical intelligence state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p build
          release_status="$(curl --silent --show-error \
            --output build/radar-state-release.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/releases/tags/radar-state")"
          case "$release_status" in
            200)
              if jq -e '.assets[]? | select(.name == "intelligence-state.tar.gz")' \
                build/radar-state-release.json >/dev/null; then
                gh release download radar-state \
                  --pattern intelligence-state.tar.gz \
                  --dir build \
                  --clobber
                uv run radar intelligence-state-restore --root . \
                  --archive build/intelligence-state.tar.gz
              else
                echo "radar-state exists without an asset; bootstrapping canonical state."
              fi
              ;;
            404)
              echo "No radar-state release found; bootstrapping canonical state."
              ;;
            *)
              echo "Unexpected GitHub API status while restoring state: ${release_status}" >&2
              exit 1
              ;;
          esac

      - name: Rebuild canonical intelligence
        run: |
          uv run radar intelligence-migrate --root .
          uv run radar intelligence-replay-events --root .

      - name: Discover intelligence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run radar intelligence-run discovery --root .

      - name: Backfill lineage
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          uv run radar intelligence-lineage-backfill --root . \
            --fetch-limit 150 --parent-limit 100 --max-minutes 20
          uv run radar intelligence-lineage-triage --root . \
            --fetch-limit 60 --max-minutes 10

      - name: Checkpoint discovered intelligence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run radar intelligence-state-pack --root . \
            --out build/intelligence-state.tar.gz
          gh release view radar-state >/dev/null 2>&1 || \
            gh release create radar-state \
              --target "$GITHUB_SHA" \
              --title "Radar canonical state" \
              --notes "Replaceable canonical intelligence checkpoint."
          gh release upload radar-state \
            build/intelligence-state.tar.gz \
            --clobber

      - name: Verify new intelligence
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          started_at="$(date +%s)"
          verify_output="$(uv run radar intelligence-run verify-new --root .)"
          echo "$verify_output"
          processed="$(jq -r '.result.processed // 0' <<<"$verify_output")"
          remaining="$(jq -r '.result.remaining // 0' <<<"$verify_output")"
          elapsed="$(( $(date +%s) - started_at ))"
          {
            echo "### Verify new intelligence"
            echo "- Processed: ${processed}"
            echo "- Remaining: ${remaining}"
            echo "- Elapsed seconds: ${elapsed}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Reverify trusted claims
        if: github.event.schedule == '43 5 * * 0' || github.event_name == 'workflow_dispatch'
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: uv run radar intelligence-run verification --root .

      - name: Scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RADAR_WEBHOOK_URL: ${{ secrets.RADAR_WEBHOOK_URL }}
        run: |
          uv run radar init --root .
          uv run radar scan --root . --days 7 --publish-history
          uv run radar models scan --root .
          uv run radar models candidates scan --root .
          uv run radar models benchmarks scan --root .
          uv run radar models platforms-verify --root .
          uv run radar research scan --root .
          uv run radar research candidates scan --root .
          uv run radar trending scan --root .
          uv run radar news scan --root .
          uv run radar news classify --root .
          uv run radar desk brief --root .
          uv run radar desk auto-resolve --root .
          uv run radar alerts notify --root . \
            --base-url "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}"
          enrichment_output="$(uv run radar intelligence-run enrichment --root .)"
          echo "$enrichment_output"
          {
            echo "### Intelligence enrichment"
            echo "- Processed: $(jq -r '.result.processed // 0' <<<"$enrichment_output")"
            echo "- Remaining: $(jq -r '.result.remaining // 0' <<<"$enrichment_output")"
          } >> "$GITHUB_STEP_SUMMARY"
          uv run radar intelligence-run qualification --root .
          uv run radar intelligence-run recommendations --root .

      # Publish gate keyed on the RUN (not the DB union): refuse to export a
      # degraded or near-empty scan (see 2026-07-27 hardening spec).
      - name: Scan health gate
        run: uv run radar scan-health --root . --check

      # Quality gate: fail the run if scoring collapsed (rings stopped
      # discriminating). Runs on the persisted scan, before publishing.
      - name: Scoring quality gate
        run: uv run radar calibrate-report --root . --check

      - name: Checkpoint verified intelligence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run radar intelligence-state-pack --root . \
            --out build/intelligence-state.tar.gz
          gh release upload radar-state \
            build/intelligence-state.tar.gz \
            --clobber

      # `radar export` copies data/history.jsonl into the site for download.
      # --base-url makes the Atom/RSS feed self/link URLs absolute. Derived from
      # the repo context via env vars (never interpolated into the shell line
      # directly). Assumes the default github.io Pages domain — adjust if a
      # custom CNAME is ever configured. `github.repository`/`repository_owner`
      # are always populated, including on scheduled runs.
      - name: Export static site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_FULL: ${{ github.repository }}
        run: |
          repo_name="${REPO_FULL#*/}"
          uv run radar export --root . --out _site \
            --base-url "https://${OWNER}.github.io/${repo_name}"
          mkdir -p data/intelligence
          cp _site/data/public-snapshot.v1.json \
            data/intelligence/public-snapshot.v1.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Persist only diff-friendly public logs and derived delivery data. This
      # is intentionally after artifact upload and non-blocking: an unrelated
      # bot commit must not prevent a verified site from deploying.
      - name: Persist history log + keepalive
        continue-on-error: true
        run: |
          scripts/persist_publication.sh \
            data/history.jsonl \
            data/source-health.jsonl \
            data/model-history.jsonl \
            data/model-metrics.jsonl \
            data/model-candidate-observations.jsonl \
            data/benchmark-observations.jsonl \
            data/technique-candidate-observations.jsonl \
            data/technique-history.jsonl \
            data/technique-metrics.jsonl \
            data/trending-observations.jsonl \
            data/news-observations.jsonl \
            data/news-classified.jsonl \
            data/alerts-delivered.jsonl \
            data/calls-ledger.jsonl \
            "data/briefs/" \
            data/intelligence/public-snapshot.v1.json

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # GitHub Pages' deploy API intermittently returns "Deployment failed, try
      # again later" — a transient backend error unrelated to the build. Retry up
      # to three times with backoff so a scheduled deploy self-heals instead of
      # needing a manual re-run. Only the final attempt is unguarded, so a genuine
      # persistent failure still surfaces as a red job.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Back off before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Back off before final attempt
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (final attempt)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
