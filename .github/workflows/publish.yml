name: Publish radar to Pages

# Radar Pulse, every two hours: collect (Hugging Face, GitHub, news feeds),
# triage with Jev, build the site, deploy, persist the item store. The
# homelab worker (deploy/homelab) reads the published pulse.v1.json for the
# Telegram digest; nothing else depends on this run.

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - "frontend/**"
      - ".github/workflows/publish.yml"

permissions:
  contents: write # persist data/pulse/*.jsonl
  pages: write
  id-token: write

# One deployment at a time; never cancel one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Shallow: persist_publication.sh only rebases its one commit onto origin/main.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 20

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install package
        run: uv sync --locked

      - uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend

      # A total outage of every source, or a failed triage, is surfaced as a
      # run annotation but never blocks the publish: the site then shows the
      # last good items, with the failing sources named in its health panel.
      - name: Collect and triage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          uv run radar pulse collect --root . \
            || echo "::warning title=Pulse::every Pulse source failed this run"
          uv run radar pulse triage --root . \
            || echo "::warning title=Pulse::triage failed; items stay untriaged this run"

      # --base-url makes RSS links absolute. Derived from the repo context via
      # env vars (never interpolated into the shell line directly); assumes the
      # default github.io Pages domain.
      - name: Export static site
        env:
          OWNER: ${{ github.repository_owner }}
          REPO_FULL: ${{ github.repository }}
        run: |
          repo_name="${REPO_FULL#*/}"
          uv run radar pulse export --root . --out _site \
            --base-url "https://${OWNER}.github.io/${repo_name}"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # After the artifact upload and non-blocking: an unrelated bot commit
      # must never prevent a verified site from deploying.
      - name: Persist Pulse item store
        continue-on-error: true
        run: scripts/persist_publication.sh data/pulse/items.jsonl data/pulse/labels.jsonl

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      # GitHub Pages' deploy API intermittently returns "Deployment failed, try
      # again later" — a transient backend error unrelated to the build. Retry up
      # to three times with backoff so a scheduled deploy self-heals instead of
      # needing a manual re-run. Only the final attempt is unguarded, so a genuine
      # persistent failure still surfaces as a red job.
      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy1
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Back off before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy2
        if: steps.deploy1.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5
      - name: Back off before final attempt
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - name: Deploy to GitHub Pages (final attempt)
        id: deploy3
        if: steps.deploy1.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
