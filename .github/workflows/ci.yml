name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v8.2.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install package + dev deps
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Ruff
        run: uv run ruff check src tests

      - name: Mypy
        run: uv run mypy src/radar

      - name: Tests with coverage
        run: uv run pytest --cov -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - uses: actions/setup-node@v6
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          uv sync --locked
          npm ci --prefix frontend

      - name: Frontend unit, type, lint, and build
        run: |
          npm test --prefix frontend
          npm run typecheck --prefix frontend
          npm run lint --prefix frontend
          npm run build --prefix frontend

      # Offline: renders the tracked data/pulse store, no network sources.
      - name: Export static site
        run: uv run radar pulse export --root . --out _site

      - name: Install Playwright browser
        run: npx --prefix frontend playwright install --with-deps chromium

      - name: Browser checks
        run: cd frontend && npx playwright test
